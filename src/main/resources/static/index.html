<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">

<title>Samjhao</title>
<style>
  :root {
    --bg: #f7f8fa; --card: #ffffff; --ink: #12151c; --muted: #6b7280; --line: #e4e7ec;
    --accent: #3b4cca; --accent-ink: #ffffff;
    --amber: #a85d00; --amber-bg: #fff6e5; --red: #b42318; --red-bg: #fef0ee;
    --skeleton-a: #eceff3; --skeleton-b: #f6f7f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #161a22; --ink: #eef0f4; --muted: #99a1af; --line: #272d38;
      --accent: #7c8bff; --accent-ink: #0e1116;
      --amber: #f2b45a; --amber-bg: #2a2114; --red: #ff8a7a; --red-bg: #2b1815;
      --skeleton-a: #1e232d; --skeleton-b: #272d38;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Bengali", "Noto Sans Tamil", "Noto Sans Telugu", sans-serif;
    line-height: 1.6; min-height: 100vh;
  }
  .stage { max-width: 560px; margin: 0 auto; padding: 20px 20px 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }

  /* Top bar with language dropdown centered */
  .topbar { width: 100%; display: flex; justify-content: center; }
  .lang { position: relative; }
  .lang-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer;
    font: inherit; font-size: .92rem; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; transition: border-color .15s;
  }
  .lang-btn:hover:not(:disabled), .lang-btn[aria-expanded="true"] { border-color: var(--accent); }
  .lang-btn:disabled { opacity: .5; cursor: not-allowed; }
  .lang-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .lang-btn .chev { width: 14px; height: 14px; transition: transform .15s; }
  .lang-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .lang-list {
    position: absolute; inset-inline-end: 0; top: calc(100% + 8px); z-index: 10; margin: 0; padding: 6px;
    list-style: none; width: 230px; max-height: 340px; overflow-y: auto; text-align: start;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    animation: pop .14s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .lang-list li {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 9px 12px; border-radius: 9px; cursor: pointer;
  }
  .lang-list li small { color: var(--muted); font-size: .8rem; }
  .lang-list li.active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .lang-list li[aria-selected="true"] { color: var(--accent); font-weight: 600; }

  h1 { font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-weight: 600; font-size: 3rem; letter-spacing: -0.03em; margin: 28px 0 0; }
  .tagline { margin: 10px 0 0; color: var(--muted); font-size: 1.05rem; max-width: 38ch; }

  .card { width: 100%; margin-top: 32px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }

  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 180px; border: 1.5px dashed var(--line); border-radius: 12px; cursor: pointer;
    color: var(--muted); padding: 20px; transition: border-color .15s, background-color .15s;
  }
  .drop:hover, .drop:focus-visible, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .drop strong { color: var(--ink); font-weight: 600; }
  .drop svg { width: 30px; height: 30px; stroke: var(--muted); fill: none; stroke-width: 1.5; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .drop .hint { font-size: .85rem; }

  .preview { position: relative; border-radius: 12px; overflow: hidden; background: var(--skeleton-a); }
  .preview img { display: block; width: 100%; max-height: 300px; object-fit: contain; }
  .preview.scanning::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 56px;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--accent) 38%, transparent), transparent);
    border-bottom: 2px solid var(--accent); animation: scan 2.2s ease-in-out infinite;
  }
  .preview.scanning img { opacity: .78; }
  @keyframes scan { 0% { transform: translateY(-56px); } 100% { transform: translateY(300px); } }

  .change { margin-top: 10px; background: none; border: 0; color: var(--muted); font: inherit; font-size: .9rem; cursor: pointer; text-decoration: underline; }
  .change:hover { color: var(--ink); }

  .controls { margin-top: 16px; display: flex; }
  button.go {
    flex: 1; padding: 13px 16px; border: 0; border-radius: 10px; cursor: pointer;
    font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink);
    transition: transform .1s, opacity .15s;
  }
  button.go:hover:not(:disabled) { transform: translateY(-1px); }
  button.go:disabled { opacity: .4; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .privacy { margin: 14px 0 0; color: var(--muted); font-size: .85rem; }

  .progress { margin-top: 18px; text-align: start; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .stage-text { font-weight: 600; }
  .elapsed { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .9rem; white-space: nowrap; direction: ltr; }
  .bar { margin-top: 10px; height: 4px; border-radius: 4px; background: var(--skeleton-a); overflow: hidden; direction: ltr; }
  .bar::before { content: ""; display: block; height: 100%; width: 35%; border-radius: 4px; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  .skeleton { margin-top: 18px; display: grid; gap: 10px; }
  .skeleton i { display: block; height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--skeleton-a) 25%, var(--skeleton-b) 50%, var(--skeleton-a) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
  .skeleton i:nth-child(1) { width: 92%; } .skeleton i:nth-child(2) { width: 78%; }
  .skeleton i:nth-child(3) { width: 85%; } .skeleton i:nth-child(4) { width: 55%; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .result { width: 100%; margin-top: 24px; text-align: start; }
  .doc-type { color: var(--muted); font-size: .95rem; text-align: center; }
  .summary { font-family: Georgia, "Iowan Old Style", serif; font-size: 1.4rem; line-height: 1.5; margin: 8px 0; text-align: center; min-height: 2.9em; }
  .caret::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .block { margin-top: 14px; padding: 16px 18px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .block h2 { margin: 0 0 8px; font-size: 1rem; }
  .block ul { margin: 0; padding-inline-start: 20px; }
  .block li { margin: 5px 0; }
  .block.deadlines { background: var(--amber-bg); border-color: transparent; }
  .block.deadlines h2 { color: var(--amber); }
  .block.warnings { background: var(--red-bg); border-color: transparent; }
  .block.warnings h2 { color: var(--red); }
  .reveal { opacity: 0; transform: translateY(8px); animation: reveal .45s ease forwards; }
  @keyframes reveal { to { opacity: 1; transform: none; } }

  .row { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .ghost { padding: 10px 16px; border-radius: 10px; cursor: pointer; font: inherit; font-weight: 600; background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .ghost:hover { border-color: var(--accent); }
  .ghost.on { border-color: var(--accent); color: var(--accent); }
  .disclaimer { margin-top: 18px; color: var(--muted); font-size: .8rem; text-align: center; }
  .error { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--red-bg); color: var(--red); text-align: start; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::after, *::before { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .reveal { opacity: 1; transform: none; }
  }
  @media (max-width: 480px) { h1 { font-size: 2.4rem; } }
</style>
</head>

    </div>

      <span><strong data-i18n="choose"></strong> <span data-i18n="orDrop"></span></span>
      <span class="hint" data-i18n="pasteHint"></span>
    </label>

    <div id="previewWrap" hidden>
      <div class="preview" id="preview"><img id="previewImg" alt=""></div>
      <button class="change" id="change" type="button" data-i18n="change"></button>
    </div>

    <div class="controls">
      <button class="go" id="go" type="button" disabled data-i18n="go"></button>
    </div>

    <div class="progress" id="progress" hidden aria-live="polite">
      <div class="progress-top">
        <span class="stage-text" id="stageText"></span>
        <span class="elapsed" id="elapsed">0:00</span>
      </div>
      <div class="bar"></div>
      <div class="skeleton" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <button class="change" id="cancel" type="button" data-i18n="cancel"></button>
    </div>

    <div class="error" id="error" hidden role="alert"></div>
    <p class="privacy" id="privacy" data-i18n="privacy"></p>
  </section>

  <section class="result" id="result" hidden></section>
</main>

  }

  goBtn.addEventListener('click', async () => {
    if (!currentFile || loading) return;
    controller = new AbortController();
    const requested = lang;
    startLoading();
    const form = new FormData();
    form.append('file', currentFile);
    form.append('language', requested.name);
    try {
      const res = await fetch('/explain', { method: 'POST', body: form, signal: controller.signal });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || '');
      stopLoading();
      resultLang = requested;
      render(data);
    } catch (e) {
      stopLoading();
      if (e.name !== 'AbortError') {
        errorBox.textContent = t('err') + ' ' + (e.message || '');
        errorBox.hidden = false;
      }
    }
  });
  $('cancel').addEventListener('click', () => controller && controller.abort());

  /* ---------- result ---------- */
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function block(cls, title, items) {
    if (!items || !items.length) return null;
    const b = el('div', 'block ' + cls);
    b.appendChild(el('h2', null, title));
    const ul = el('ul');
    items.forEach(i => ul.appendChild(el('li', null, i)));
    b.appendChild(ul);
    return b;
  }
  function typeText(node, text, done) {
    clearInterval(typer);
    if (reduceMotion) { node.textContent = text; done(); return; }
    const words = text.split(/\s+/); let i = 0;
    node.classList.add('caret'); node.textContent = '';
    typer = setInterval(() => {
      node.textContent = words.slice(0, ++i).join(' ');
      if (i >= words.length) { clearInterval(typer); node.classList.remove('caret'); done(); }
    }, 40);
  }

  function render(d) {
    const summary = el('p', 'summary');
    const rest = [
      block('todo', t('todo'), d.what_you_must_do),
      block('deadlines', t('deadlines'), d.deadlines),
      block('warnings', t('careful'), d.warnings)
    ].filter(Boolean);

    const again = el('button', 'ghost', t('again'));
    again.type = 'button';
    again.addEventListener('click', () => { clearFile(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    const row = el('div', 'row'); row.append(again);
    const note = el('p', 'disclaimer', t('disclaimer'));

    resultEl.replaceChildren(el('div', 'doc-type', d.document_type || ''), summary);
    resultEl.hidden = false;
    resultEl.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });

    typeText(summary, d.summary || '', () => {
      [...rest, row, note].forEach((n, i) => {
        n.classList.add('reveal'); n.style.animationDelay = (i * 140) + 'ms';
        resultEl.appendChild(n);
      });
    });
  }

  /* ---------- start ---------- */
  let saved = null;
  try { saved = localStorage.getItem('samjhao-lang'); } catch (e) {}
  setLanguage(LANGS.find(l => l.code === saved) || LANGS[0]);
</script>
</body>
</html>
